; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack_atoms3
description = A 1D LED strip game that pulls data from the environment.

[env:console]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
    adafruit/Adafruit NeoPixel@^1.12.0
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=3               ; Enable debug logging
    -DQTPY_S3                         ; Define board type for pin mapping  
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Enable USB CDC for QT Py S3
    -DBOARD_HAS_PSRAM                 ; Enable PSRAM support
    -DNEOPIXEL_PIN=39                 ; QT Py ESP32-S3 NeoPixel on GPIO 39
    -DCONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=0 ; Disable WiFi AMPDU to reduce power
    -DCONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=0
build_src_filter = +<main.cpp> +<audio_system.cpp> -<display_unit.cpp> -<wifi_test.cpp>

; M5Stack Atom S3 Display Board Environment  
[env:m5stack_atoms3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    fastled/FastLED@^3.6.0
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=3               ; Enable debug logging
    -DM5STACK_ATOMS3                  ; Define board type for display unit
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Enable USB CDC
    -DBOARD_HAS_PSRAM                 ; Enable PSRAM support
build_src_filter = +<full_led_display.cpp> -<main.cpp> -<audio_system.cpp> -<display_unit.cpp> -<wifi_test.cpp>

; Legacy console environment for original ESP32-WROOM board
[env:console_legacy]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
monitor_speed = 115200
upload_speed = 460800  ; Reduced upload speed for power stability
monitor_filters = esp32_exception_decoder
build_flags = 
    -DCORE_DEBUG_LEVEL=3               ; Enable debug logging
    -DCONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=0 ; Disable WiFi AMPDU to reduce power
    -DCONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=0
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=160 ; Reduce CPU frequency for power savings
    -DCONFIG_FREERTOS_HZ=100           ; Lower FreeRTOS tick rate
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4  ; Reduce WiFi buffers
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
build_src_filter = +<main.cpp> +<audio_system.cpp> -<display_unit.cpp> -<wifi_test.cpp>

; Minimal WiFi test environment for diagnostics
[env:wifi_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags = 
    -DCORE_DEBUG_LEVEL=5  ; Maximum debug output
build_src_filter = +<wifi_test.cpp> -<main.cpp> -<audio_system.cpp> -<display_unit.cpp>

; Flash erase environment
[env:erase]
platform = espressif32
board = esp32dev
framework = arduino
upload_command = esptool.py --chip esp32 --port $UPLOAD_PORT erase_flash

; Generic ESP32-S3 config for QT Py S3 hardware
[env:generic_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
monitor_filters = esp32_exception_decoder
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<minimal_test.cpp> -<main.cpp> -<audio_system.cpp> -<display_unit.cpp> -<wifi_test.cpp> -<espnow_test.cpp> -<simple_blink_test.cpp>
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv

; QT Py S3 ESP-NOW Communication Test (Working Config)
[env:qtpy_espnow]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
upload_speed = 460800
; upload_port = /dev/cu.usbmodem11301  ; Auto-detect port
; monitor_port = /dev/cu.usbmodem11301  ; Auto-detect port  
monitor_filters = esp32_exception_decoder
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DQTPY_S3
    -DESPNOW_TEST
build_src_filter = +<qtpy_espnow_test.cpp> -<main.cpp> -<audio_system.cpp> -<display_unit.cpp> -<wifi_test.cpp> -<espnow_test.cpp> -<simple_blink_test.cpp> -<minimal_test.cpp>
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv

[env:display]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<full_led_display.cpp> -<main.cpp> -<display_unit.cpp> -<display_unit_test.cpp> -<minimal_test.cpp> -<pin_test.cpp> -<absolute_minimal.cpp> -<immediate_test.cpp> -<onboard_led_test.cpp> -<environmental_game_display.cpp> -<led_strip_test.cpp>
