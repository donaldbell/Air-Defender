; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = console
description = Air Defender - an environmental 1D LED strip game.

[env:console]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
	adafruit/Adafruit NeoPixel@^1.12.0
	fastled/FastLED@^3.10.3
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DM5STACK_ATOMS3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
build_src_filter = +<console_unit.cpp> +<communication_protocol.cpp> +<status_led.cpp>

[env:controller]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
	adafruit/Adafruit NeoPixel@^1.12.0
	fastled/FastLED@^3.10.3
	marcoschwartz/LiquidCrystal_I2C@1.1.4
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DQTPY_S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
build_src_filter = +<controller_unit.cpp> +<audio_system.cpp> +<communication_protocol.cpp> +<status_led.cpp> +<lcd_display.cpp>
