; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = console
description = A 1D LED strip game that pulls data from the environment.

; QT Py S3 Console Unit (Primary Controller)
[env:console]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
    adafruit/Adafruit NeoPixel@^1.12.0
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=3               ; Enable debug logging
    -DQTPY_S3                         ; Define board type for pin mapping  
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Enable USB CDC for QT Py S3
    -DBOARD_HAS_PSRAM                 ; Enable PSRAM support
    -DNEOPIXEL_PIN=39                 ; QT Py ESP32-S3 NeoPixel on GPIO 39
build_src_filter = +<main.cpp> +<audio_system.cpp> -<display_unit.cpp>

; M5Stack Atom S3 Display Unit
[env:display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=3               ; Enable debug logging
    -DM5STACK_ATOMS3                  ; Define board type for display unit
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Enable USB CDC
    -DBOARD_HAS_PSRAM                 ; Enable PSRAM support
build_src_filter = +<display_unit.cpp> -<main.cpp> -<audio_system.cpp>

; Generic Test Environment (for archived tests)
[env:test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    fastled/FastLED@^3.6.0
    adafruit/Adafruit NeoPixel@^1.12.0
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DQTPY_S3
build_src_filter = +<archive/*> -<main.cpp> -<audio_system.cpp> -<display_unit.cpp>